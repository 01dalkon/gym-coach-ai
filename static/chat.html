<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymCoach AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
  /* ── Light tokens (default) ─────────────────────────────── */
  :root {
    --bg:          #F2F2F7;
    --panel:       #FFFFFF;
    --panel-border:#E5E5EA;
    --bubble-user: #2D6BE4;
    --bubble-bot:  #FFFFFF;
    --bubble-bot-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
    --text:        #1C1C1E;
    --text-user:   #FFFFFF;
    --muted:       #8E8E93;
    --accent:      #2D6BE4;
    --accent-soft: #EBF1FD;
    --online:      #34C759;
    --radius:      18px;
    --input-bg:    #F2F2F7;
  }

  /* ── Dark tokens (system preference) ───────────────────── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #000000;
      --panel:       #1C1C1E;
      --panel-border:#2C2C2E;
      --bubble-user: #2D6BE4;
      --bubble-bot:  #2C2C2E;
      --bubble-bot-shadow: 0 1px 3px rgba(0,0,0,.3);
      --text:        #F2F2F7;
      --text-user:   #FFFFFF;
      --muted:       #8E8E93;
      --accent:      #4A8CF7;
      --accent-soft: #1C2A45;
      --online:      #34C759;
      --input-bg:    #2C2C2E;
    }
  }

  /* ── Dark tokens (explicit toggle) ─────────────────────── */
  :root[data-theme="dark"] {
    --bg:          #000000;
    --panel:       #1C1C1E;
    --panel-border:#2C2C2E;
    --bubble-user: #2D6BE4;
    --bubble-bot:  #2C2C2E;
    --bubble-bot-shadow: 0 1px 3px rgba(0,0,0,.3);
    --text:        #F2F2F7;
    --text-user:   #FFFFFF;
    --muted:       #8E8E93;
    --accent:      #4A8CF7;
    --accent-soft: #1C2A45;
    --online:      #34C759;
    --input-bg:    #2C2C2E;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    padding: 14px 18px;
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-avatar {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .header-info { flex: 1; min-width: 0; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
  header .subtitle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); flex-shrink: 0; }

  /* ── Messages area ──────────────────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #messages::-webkit-scrollbar { width: 0; }

  /* ── Bubbles ────────────────────────────────────────────── */
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--text-user);
    border-bottom-right-radius: 5px;
    margin-top: 8px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 5px;
    box-shadow: var(--bubble-bot-shadow);
    white-space: pre-wrap;
  }
  .msg.bot b, .msg.bot strong { color: var(--accent); font-weight: 600; }
  .msg img.attach { max-width: 200px; border-radius: 10px; display: block; margin-top: 8px; }

  /* ── Bot turn wrapper ───────────────────────────────────── */
  .bot-turn {
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 100%;
    margin-top: 8px;
  }
  .bot-turn .msg { align-self: flex-start; margin-top: 0; }

  /* ── Typing indicator ───────────────────────────────────── */
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    box-shadow: var(--bubble-bot-shadow);
    color: var(--muted);
    font-size: 13px;
    border-bottom-left-radius: 5px;
    margin-top: 8px;
    padding: 10px 14px;
  }

  /* ── Exercise cards ─────────────────────────────────────── */
  .cards {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 2px 0 6px;
    max-width: min(100vw - 32px, 680px);
    scrollbar-width: none;
  }
  .cards::-webkit-scrollbar { display: none; }
  .card {
    min-width: 168px; max-width: 168px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .card img { width: 100%; height: 130px; object-fit: cover; background: var(--bg); display: block; }
  .card .body { padding: 9px 11px 10px; }
  .card .name { font-size: 12px; font-weight: 600; text-transform: capitalize; color: var(--text); line-height: 1.3; }
  .card .meta { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: capitalize; line-height: 1.4; }
  .card details { margin-top: 7px; }
  .card summary {
    font-size: 11px; font-weight: 500;
    color: var(--accent);
    cursor: pointer;
    list-style: none;
    display: flex; align-items: center; gap: 3px;
  }
  .card summary::before { content: '▸'; font-size: 9px; }
  details[open] summary::before { content: '▾'; }
  .card details p { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

  /* ── Input bar ──────────────────────────────────────────── */
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px 14px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    align-items: center;
  }
  #preview { display: none; position: relative; }
  #preview img { height: 42px; border-radius: 8px; }
  #preview button {
    position: absolute; top: -5px; right: -5px;
    background: var(--muted); color: #fff;
    border: none; border-radius: 50%;
    width: 17px; height: 17px; font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  label.attach { cursor: pointer; font-size: 20px; padding: 4px; opacity: .7; transition: opacity .1s; }
  label.attach:hover { opacity: 1; }
  input[type=file] { display: none; }
  input[type=text] {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text]:focus { border-color: var(--accent); }
  button.send {
    background: var(--accent);
    border: none; color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .1s;
    flex-shrink: 0;
  }
  button.send:hover { opacity: .9; transform: scale(1.05); }
  button.send:disabled { opacity: .4; transform: none; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="header-avatar">🏋️</div>
  <div class="header-info">
    <h1>GymCoach AI</h1>
    <div class="subtitle"><span class="dot"></span>Tu entrenador virtual</div>
  </div>
</header>
<div id="messages">
  <div class="msg bot">¡Hola! 💪 Soy tu coach virtual. Escríbeme tu rutina o envíame una <b>foto del WOD</b> y te explico cada ejercicio con su animación.</div>
</div>
<form id="form">
  <div id="preview"><img id="previewImg"><button type="button" id="clearImg">×</button></div>
  <label class="attach" title="Adjuntar foto de la rutina">📷<input type="file" id="file" accept="image/*"></label>
  <input type="text" id="input" placeholder="Ej: explícame qué es un power clean..." autocomplete="off">
  <button class="send" id="send" type="submit">➤</button>
</form>
<script>
const API = (window.GYMCOACH_API || '') + '/api/chat';
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const sendBtn = document.getElementById('send');
let history = [];

fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  previewImg.src = URL.createObjectURL(f);
  preview.style.display = 'block';
};
document.getElementById('clearImg').onclick = () => { fileInput.value = ''; preview.style.display = 'none'; };

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function md(s) {
  // Protección: si el backend devolvió JSON crudo como reply, extraerlo aquí
  const trimmed = s.trim();
  if (trimmed.startsWith('{')) {
    try { const p = JSON.parse(trimmed); if (p.reply) s = p.reply; } catch(e) {}
  }
  // Convertir secuencias \n literales a saltos de línea reales
  s = s.replace(/\\n/g, '\n');
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addBotTurn(html, exercises) {
  const turn = document.createElement('div');
  turn.className = 'bot-turn';

  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg bot';
  msgDiv.innerHTML = html;
  turn.appendChild(msgDiv);

  if (exercises && exercises.length) {
    const wrap = document.createElement('div');
    wrap.className = 'cards';
    let cardsHtml = '';
    for (const ex of exercises) {
      const media = ex.gif || ex.image;
      cardsHtml += `<div class="card">
        ${media ? `<img loading="lazy" src="${esc(media)}" alt="${esc(ex.name)}">` : ''}
        <div class="body">
          <div class="name">${esc(ex.name)}</div>
          <div class="meta">🎯 ${esc(ex.target || '')} · 🏋 ${esc(ex.equipment || '')}</div>
          ${ex.instructions ? `<details><summary>Instrucciones</summary><p>${esc(ex.instructions)}</p></details>` : ''}
        </div>
      </div>`;
    }
    wrap.innerHTML = cardsHtml;
    turn.appendChild(wrap);
  }

  messagesEl.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  const file = fileInput.files[0];
  if (!text && !file) return;

  let userHtml = esc(text);
  if (file) userHtml += `<img class="attach" src="${URL.createObjectURL(file)}">`;
  addMsg('user', userHtml);
  input.value = ''; fileInput.value = ''; preview.style.display = 'none';
  sendBtn.disabled = true;
  const typing = addMsg('typing', 'Analizando…');

  const fd = new FormData();
  fd.append('message', text);
  fd.append('history', JSON.stringify(history));
  if (file) fd.append('image', file);

  try {
    const res = await fetch(API, { method: 'POST', body: fd });
    const data = await res.json();
    typing.remove();
    if (!res.ok) { addBotTurn('⚠️ ' + esc(data.detail || 'Error inesperado.'), []); return; }
    addBotTurn(md(data.reply), data.exercises || []);
    history.push({ role: 'user', content: text || '[imagen de rutina]' });
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    typing.remove();
    addBotTurn('⚠️ No pude conectar con el servidor.', []);
  } finally {
    sendBtn.disabled = false;
  }
};
</script>
</body>
</html>
