services:
  redis:
    image: redis:7-alpine
    container_name: gymcoach-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gymcoach-api:
    build: .
    image: gymcoach-api:latest
    container_name: gymcoach-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
